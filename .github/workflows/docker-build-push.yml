name: Build and Push amd64 Docker Image

on:
  push:
    branches:
      # update this branch to main after testing
      - multi-arch-support
    paths-ignore:
      - '**/*.md'

env:
  TZ: /usr/share/zoneinfo/Asia/Kathmandu
  # 1m cache segment restore timeout to stop wasting resource time
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
  
# workflow can only read this repo’s code but cannot change
# workflow can push Docker or GHCR images
permissions:
  contents: read
  packages: write

jobs:
  generate-artifact:
    strategy:
      matrix:
        include:
          - name: amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.registry.yarsa.org
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone frappe_docker
        run: git clone --depth=1 https://github.com/frappe/frappe_docker

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: ./frappe_docker
          platforms: ${{ matrix.platform }}
          file: frappe_docker/images/custom/Containerfile
          push: true
          tags: docker.registry.yarsa.org/yarsalabs/nepal-compliance:latest
          cache-from: type=registry,ref=docker.io/yarsalabs/nepal-compliance:latest
          cache-to: type=inline
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-15
            PYTHON_VERSION=3.11.9
            NODE_VERSION=18.20.2
          

      


      # - name: Docker buildX, Push Image, Use GHA Cache
      #   run: |
      #     cd frappe_docker
      #     docker buildx build \
      #       --no-cache \
      #       --platform linux/amd64 \
      #       --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
      #       --build-arg FRAPPE_BRANCH=version-15 \
      #       --build-arg PYTHON_VERSION=3.11.9 \
      #       --build-arg NODE_VERSION=18.20.2 \
      #       --build-arg APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }} \
      #       --tag yarsalabs/nepal-compliance:v0.1.0 \
